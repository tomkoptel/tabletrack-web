<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    TableCast (the table's screen): a television showing a d20, so it reads as the game on a
    screen. The approved drawing scaled by 0.86 about the centre, so its corners sit as far out
    as the d20's and the d6's and the three share one placement; the frame keeps the same 5.
  -->
  <g stroke="#F28482" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="14" y="19" width="72" height="51" rx="5" stroke-width="5"/>
    <polygon points="50,28 64,36 64,54 50,62 36,54 36,36" stroke-width="3.5"/>
    <polygon points="50,35 58,48 42,48" stroke-width="3"/>
    <path d="M40,83 H60 M50,70 V83" stroke-width="5"/>
  </g>
</svg>
